# Build the single-file VGA Playground simulation (https://vga-playground.com) from the
# sources in info.yaml, check it compiles, and upload it as an artifact.
name: simulation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install pyyaml
          sudo apt-get update && sudo apt-get install -y iverilog

      - name: Build simulation/VGA_playground.v
        run: python scripts/buildsim.py

      - name: Check it compiles
        run: iverilog -g2012 -s tt_um_vga_example -o /dev/null simulation/VGA_playground.v

      - name: Upload VGA Playground simulation file
        uses: actions/upload-artifact@v4
        with:
          name: VGA_playground
          path: simulation/VGA_playground.v
          if-no-files-found: error
          retention-days: 90
